%YAML 1.2
%TAG ! tag:fawkesrobotics.org,cfg/
---
doc-url: !url http://trac.fawkesrobotics.org/wiki/Plugins/webview
---

plugins/picam_client:
  ip: "192.168.0.100"
  port: 6465

  camera_intrinsics:
    width: 640
    height: 480

  stream: true

  detection:
    iou: 0.3
    conf: 0.2
    initial:
      workpiece: false
      conveyor: false
      slide: false

  camera_matrix:
    rotation: 0

    # for rotation = 0; changes computed through rotation
    old_ppx: 318.11536462152407
    old_ppy: 228.6351132325681
    old_f_x: 792.1682407848058
    old_f_y: 792.6059140248458
    new_ppx: 318.11381299426
    new_ppy: 228.25186138442461
    new_f_x: 681.2231206201194
    new_f_y: 683.7395089886643
    k1: -0.494594102
    k2: 0.327411724
    k3: 0.00172258759
    k4: 0.000379424168
    k5: -0.163266317

  buffer:
    shm_image_id: "picam"
    shm_image_id_res: "object_tracking_pi"

plugins/object_tracking:
  if_name: "object-tracking"

  if:
    laser_lines: [
      "/laser-lines/1",
      "/laser-lines/2",
      "/laser-lines/3",
      "/laser-lines/4",
      "/laser-lines/5",
      "/laser-lines/6",
      "/laser-lines/7",
      "/laser-lines/8"
    ]

  # params for expected position

  puck_values:
    puck_size: 0.02
    puck_height: 0.025
    ring_height: 0.01

  belt_values:
    belt_height: 0.895
    belt_length: 0.35
    belt_offset_side: 0.025
    belt_offset_front: 0.005
    # height/size of the belt itself
    belt_size: 0.045

  slide_values:
    slide_offset_side: -0.28
    slide_offset_front: 0.01
    slide_height: 0.91

  shelf_values:
    left_shelf_offset_side: -0.075
    middle_shelf_offset_side: -0.175
    right_shelf_offset_side: -0.275
    shelf_offset_front: 0.01
    shelf_height: 0.89

  # frame to use for the weighted average and the target frames
  target_frame: "/odom"
  camera_frame: "gripper_cam"

  tf:
    object_pos_frame: "object_pos"
    weighted_object_pos_frame: "weighted_object_pos"

  # maximal distance between yolo response and last weighted average to accept
  #  as target object
  max_acceptable_dist: 0.1

  yolo:
    weights_path: "../cfg/yolo/best.onnx"
    config_path: "../cfg/yolo/yolov4-tiny.cfg"
    # input size
    width: 640
    height: 640

  buffer:
    shm_image_id: "picam"
    shm_image_id_res: "object_tracking"
    frame: "gripper_cam"

  laser_line_fit:
    max_dist: 3
    visibility_history: 3
    max_angle: 0.7
