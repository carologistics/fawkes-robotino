%YAML 1.2
%TAG ! tag:fawkesrobotics.org,cfg/
---
doc-url: !url http://trac.fawkesrobotics.org/wiki/Plugins/webview
---
plugins/vs_offsets:
  # distance between object and target base pose
  base_offset_x: 0.33 #higher = further away from the mps
  base_offset_y: -0.015 #higher = more towards the right

  # "target" offsets between object pose from the object tracking plugin and
  #  the target frame before starting the routine (target in x, y, and z)
  # "up" and "down" are relative to the target pose and only change the z
  #  position of the gripper

  workpiece:
    target:
      x: -0.015
      y: 0.00
      z: -0.005

    up:
      z: 0.01

  conveyor:
    target:
      x: 0.045
      y: 0.00
      z: 0.05

    down:
      z: -0.015

    up:
      z: 0.02

  slide:
    target:
      x: 0.045
      y: 0.00
      z: 0.035

    down:
      z: -0.015

    up:
      z: 0.02
